name: Wideframe
description: >-
  Wideframe is a Y Combinator (Winter 2026) startup building an AI agent for
  video production that automates the work editors do outside the editing
  timeline. It searches, labels, organizes, and sequences raw footage across
  local filesystems and cloud storage, indexing large media libraries by meaning
  and outputting native, editable Adobe Premiere Pro (.prproj) sequences rather
  than synthetic video. Delivered as an Apple Silicon (M1+) desktop application,
  it targets brands, agencies, and professional editors who spend far longer
  preparing footage than actually cutting it. Wideframe currently ships as a
  consumer/product application with no public developer API, SDK, or
  documentation surface; this profile is maintained in the API Evangelist
  network as a company lead.
